<svg xmlns="http://www.w3.org/2000/svg" width="966" height="346" viewBox="-3 -3 966 346" role="img" aria-labelledby="b1lt b1ld"><title id="b1lt">One reader, three ways out</title><desc id="b1ld">Flow: a spreadsheet and a folder of images go to a reader with checks for BOM, missing files and duplicate ids. The reader feeds CollectionBuilder's templates, moss pages, or Jekyll with a GitHub Action. All three produce the published site.</desc><style>svg{background:#000}
text{fill:#eef3ec;font-family:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:500;font-size:16px}
text.sub{fill:#b3c0b5;font-weight:400;font-size:14.5px}
.node{fill:#0b100c;stroke:#c9d4cb;stroke-width:1.4}
.node.hl{stroke:#7db87d;stroke-width:2}
.edge{fill:none;stroke:#b9c6bb;stroke-width:1.5}
.edge.m{stroke:#7db87d;stroke-width:2.2}
.arrow{fill:#b9c6bb}
.arrow.m{fill:#7db87d}</style><defs><marker id="b1ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="arrow"/></marker><marker id="b1lm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="arrow m"/></marker></defs><path class="edge" d="M170 170H213" marker-end="url(#b1ln)"/><path class="edge" d="M405 170H432V55H458" marker-end="url(#b1ln)"/><path class="edge" d="M405 170H432V285H458" marker-end="url(#b1ln)"/><path class="edge m" d="M405 170H458" marker-end="url(#b1lm)"/><path class="edge" d="M720 55H745V170H768" marker-end="url(#b1ln)"/><path class="edge" d="M720 285H745V170H768" marker-end="url(#b1ln)"/><path class="edge m" d="M720 170H768" marker-end="url(#b1lm)"/><rect class="node" x="0" y="125" width="170" height="90" rx="8"/><text x="85" y="165" text-anchor="middle">Spreadsheet</text><text class="sub" x="85" y="185" text-anchor="middle">+ folder of images</text><rect class="node" x="215" y="115" width="190" height="110" rx="8"/><text x="310" y="155" text-anchor="middle">Reader + checks</text><text class="sub" x="310" y="175" text-anchor="middle">BOM, missing files,</text><text class="sub" x="310" y="195" text-anchor="middle">duplicate ids</text><rect class="node" x="460" y="20" width="260" height="70" rx="8"/><text x="590" y="50" text-anchor="middle">CollectionBuilder's templates</text><text class="sub" x="590" y="70" text-anchor="middle">(CB look)</text><rect class="node hl" x="460" y="135" width="260" height="70" rx="8"/><text x="590" y="165" text-anchor="middle">moss pages</text><text class="sub" x="590" y="185" text-anchor="middle">(moss look)</text><rect class="node" x="460" y="250" width="260" height="70" rx="8"/><text x="590" y="280" text-anchor="middle">Jekyll + GitHub Action</text><text class="sub" x="590" y="300" text-anchor="middle">checks and thumbnails</text><rect class="node hl" x="770" y="135" width="190" height="70" rx="8"/><text x="865" y="175" text-anchor="middle">Published site</text></svg>
