<svg xmlns="http://www.w3.org/2000/svg" width="366" height="562" viewBox="-3 -3 366 562" role="img" aria-labelledby="b1pt b1pd"><title id="b1pt">One reader, three ways out</title><desc id="b1pd">Flow, top to bottom: a spreadsheet and a folder of images go to a reader with checks for BOM, missing files and duplicate ids. The reader feeds CollectionBuilder's templates, moss pages, or Jekyll with a GitHub Action. All three produce the published site.</desc><style>svg{background:#000}
text{fill:#eef3ec;font-family:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:500;font-size:16px}
text.sub{fill:#b3c0b5;font-weight:400;font-size:14.5px}
.node{fill:#0b100c;stroke:#c9d4cb;stroke-width:1.4}
.node.hl{stroke:#7db87d;stroke-width:2}
.edge{fill:none;stroke:#b9c6bb;stroke-width:1.5}
.edge.m{stroke:#7db87d;stroke-width:2.2}
.arrow{fill:#b9c6bb}
.arrow.m{fill:#7db87d}</style><defs><marker id="b1pn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="arrow"/></marker><marker id="b1pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="arrow m"/></marker></defs><path class="edge" d="M180 68V98" marker-end="url(#b1pn)"/><path class="edge" d="M180 196V212H18V256H30" marker-end="url(#b1pn)"/><path class="edge" d="M180 196V212H18V396H30" marker-end="url(#b1pn)"/><path class="edge m" d="M180 196V212H18V326H30" marker-end="url(#b1pm)"/><path class="edge" d="M330 256H342V470H180V484" marker-end="url(#b1pn)"/><path class="edge" d="M330 396H342V470H180V484" marker-end="url(#b1pn)"/><path class="edge m" d="M330 326H342V470H180V484" marker-end="url(#b1pm)"/><rect class="node" x="60" y="8" width="240" height="60" rx="8"/><text x="180" y="33" text-anchor="middle">Spreadsheet</text><text class="sub" x="180" y="53" text-anchor="middle">+ folder of images</text><rect class="node" x="60" y="100" width="240" height="96" rx="8"/><text x="180" y="133" text-anchor="middle">Reader + checks</text><text class="sub" x="180" y="153" text-anchor="middle">BOM, missing files,</text><text class="sub" x="180" y="173" text-anchor="middle">duplicate ids</text><rect class="node" x="30" y="226" width="300" height="60" rx="8"/><text x="180" y="251" text-anchor="middle">CollectionBuilder's templates</text><text class="sub" x="180" y="271" text-anchor="middle">(CB look)</text><rect class="node hl" x="30" y="296" width="300" height="60" rx="8"/><text x="180" y="321" text-anchor="middle">moss pages</text><text class="sub" x="180" y="341" text-anchor="middle">(moss look)</text><rect class="node" x="30" y="366" width="300" height="60" rx="8"/><text x="180" y="391" text-anchor="middle">Jekyll + GitHub Action</text><text class="sub" x="180" y="411" text-anchor="middle">checks and thumbnails</text><rect class="node hl" x="60" y="486" width="240" height="56" rx="8"/><text x="180" y="519" text-anchor="middle">Published site</text></svg>
