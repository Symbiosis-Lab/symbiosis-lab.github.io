<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" role="img" aria-labelledby="mt md"><title id="mt">CollectionBuilder folder, built by Jekyll or moss, published to GitHub Pages or other hosts</title><desc id="md">A CollectionBuilder folder forks into two routes that use the same folder and files, so you can switch at any time: Jekyll, your existing build, and moss, which adds an editor, instant preview, search, maps and hosting. An arrow from moss up to Jekyll shows moss running checks, verifications and thumbnails for the Jekyll build. Both routes then flow into GitHub Pages or other hosts.</desc><defs><marker id="mn" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8L7.5 4L0.5 7.2" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mg" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8L7.5 4L0.5 7.2" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="80" y="10" width="200" height="64" rx="3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1"/><text x="180" y="38" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">CollectionBuilder</text><text x="180" y="60" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">folder</text><rect x="16" y="230" width="120" height="70" rx="3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1"/><text x="76" y="272" font-family="'Cormorant Garamond',Georgia,serif" font-size="25" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">Jekyll</text><text x="40" y="320" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.7)" text-anchor="start">your existing build</text><rect x="224" y="230" width="120" height="70" rx="3" fill="none" stroke="#7db87d" stroke-width="1.1"/><text x="284" y="272" font-family="'Cormorant Garamond',Georgia,serif" font-size="25" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">moss</text><text x="320" y="320" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.7)" text-anchor="end">editor · instant preview</text><text x="320" y="337" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.7)" text-anchor="end">search · maps · hosting</text><rect x="80" y="430" width="200" height="64" rx="3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1"/><text x="180" y="458" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">GitHub Pages</text><text x="180" y="480" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">or other hosts</text><path d="M180 75V130C180 175 76 175 76 226" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#mn)"/><path d="M180 75V130C180 175 284 175 284 226" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" marker-end="url(#mg)"/><path d="M220 265H140" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" marker-end="url(#mg)"/><path d="M30 300V370C30 410 180 385 180 426" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#mn)"/><path d="M330 300V370C330 410 180 385 180 426" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" marker-end="url(#mg)"/><text x="192" y="100" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.7)" text-anchor="start">Same folder and files,</text><text x="192" y="117" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.7)" text-anchor="start">switch any time</text><text x="180" y="220" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.92)" text-anchor="middle">checks,</text><text x="180" y="236" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.92)" text-anchor="middle">verifications,</text><text x="180" y="252" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,.92)" text-anchor="middle">thumbnails</text></svg>