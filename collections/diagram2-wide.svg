<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="wt wd"><title id="wt">CollectionBuilder folder, built by Jekyll or moss, published to GitHub Pages or other hosts</title><desc id="wd">A CollectionBuilder folder forks into two routes that use the same folder and files, so you can switch at any time: Jekyll, your existing build, and moss, which adds an editor, instant preview, search, maps and hosting. An arrow from moss up to Jekyll shows moss running checks, verifications and thumbnails for the Jekyll build. Both routes then flow into GitHub Pages or other hosts.</desc><defs><marker id="wn" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8L7.5 4L0.5 7.2" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="wg" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8L7.5 4L0.5 7.2" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="165" width="170" height="90" rx="3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1"/><text x="105" y="206" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">CollectionBuilder</text><text x="105" y="230" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">folder</text><rect x="490" y="50" width="170" height="80" rx="3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1"/><text x="575" y="98" font-family="'Cormorant Garamond',Georgia,serif" font-size="25" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">Jekyll</text><text x="575" y="34" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.7)" text-anchor="middle">your existing build</text><rect x="490" y="290" width="170" height="80" rx="3" fill="none" stroke="#7db87d" stroke-width="1.1"/><text x="575" y="338" font-family="'Cormorant Garamond',Georgia,serif" font-size="25" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">moss</text><text x="575" y="402" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.7)" text-anchor="middle">editor · instant preview · search · maps · hosting</text><rect x="785" y="165" width="155" height="90" rx="3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1"/><text x="862" y="206" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">GitHub Pages</text><text x="862" y="230" font-family="'Cormorant Garamond',Georgia,serif" font-size="19" fill="rgba(255,255,255,.92)" text-anchor="middle" font-weight="500">or other hosts</text><path d="M191 210H350C425 210 425 90 486 90" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#wn)"/><path d="M191 210H350C425 210 425 330 486 330" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" marker-end="url(#wg)"/><path d="M575 288V134" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" marker-end="url(#wg)"/><path d="M664 90C735 90 725 210 781 210" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#wn)"/><path d="M664 330C735 330 725 210 781 210" fill="none" stroke="#7db87d" stroke-width="1.1" stroke-linecap="round" marker-end="url(#wg)"/><text x="202" y="176" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.7)" text-anchor="start">Same folder and files,</text><text x="202" y="196" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.7)" text-anchor="start">switch any time</text><text x="561" y="206" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.92)" text-anchor="end">checks, verifications,</text><text x="561" y="226" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.92)" text-anchor="end">thumbnails</text></svg>