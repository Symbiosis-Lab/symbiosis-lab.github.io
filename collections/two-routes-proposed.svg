<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 512" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Proposed: one spreadsheet and folder, two routes</title>
<desc id="dsc">Your unchanged collection, a spreadsheet and a folder of objects, can be built with moss or checked inside your existing Jekyll workflow. Both end in the same published site, and you can switch at any time.</desc>
<style>
  svg{--fg:#ece8e1;--muted:#a49f98;--line:#8a8580;--faint:#3a3733;--accent:#91c127;--on-accent:#1f2a0c;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .box{fill:none;stroke:var(--line);stroke-width:1.25}
  .chip{fill:none;stroke:var(--faint);stroke-width:1.25}
  .arrow{fill:none;stroke:var(--line);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
  .t{fill:var(--fg);font-size:13px;font-weight:600}
  .s{fill:var(--muted);font-size:12px}
  .tag{fill:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .pub{fill:var(--accent);stroke:none}
  .pt{fill:var(--on-accent);font-size:13px;font-weight:600}
  .ps{fill:var(--on-accent);font-size:12px}
</style>
<text class="tag" x="10" y="14">Proposed</text>
<rect class="box" x="10" y="24" width="320" height="86" rx="8"/>
<text class="t" x="170" y="48" text-anchor="middle">Your collection, unchanged</text>
<rect class="chip" x="20" y="64" width="140" height="32" rx="5"/><text class="s" x="90" y="84" text-anchor="middle">Spreadsheet (CSV)</text>
<rect class="chip" x="180" y="64" width="140" height="32" rx="5"/><text class="s" x="250" y="84" text-anchor="middle">Folder of images, PDFs</text>
<path class="arrow" d="M85 110L85 144M87.39712769302102,139.61208719054815L85 144L82.60287230697898,139.61208719054815"/><path class="arrow" d="M255 110L255 144M257.397127693021,139.61208719054815L255 144L252.60287230697898,139.61208719054815"/>
<text class="t" x="85" y="162" text-anchor="middle">Route 1: with moss</text><rect class="box" x="10" y="178" width="150" height="52" rx="6"/><text class="t" x="85" y="202" text-anchor="middle">Open the folder</text><text class="s" x="85" y="219" text-anchor="middle">no Ruby, CB's own look</text><rect class="box" x="10" y="252" width="150" height="52" rx="6"/><text class="t" x="85" y="276" text-anchor="middle">Live preview</text><text class="s" x="85" y="293" text-anchor="middle">flags the broken row</text><rect class="box" x="10" y="326" width="150" height="52" rx="6"/><text class="t" x="85" y="350" text-anchor="middle">Publish</text><text class="s" x="85" y="367" text-anchor="middle">or export a folder</text><path class="arrow" d="M85 230L85 252M87.39712769302102,247.61208719054812L85 252L82.60287230697898,247.61208719054812"/><path class="arrow" d="M85 304L85 326M87.39712769302102,321.61208719054815L85 326L82.60287230697898,321.61208719054815"/>
<text class="t" x="255" y="162" text-anchor="middle">Route 2: on Jekyll</text><rect class="box" x="180" y="178" width="150" height="52" rx="6"/><text class="t" x="255" y="202" text-anchor="middle">Push as usual</text><text class="s" x="255" y="219" text-anchor="middle">your Jekyll workflow</text><rect class="box" x="180" y="252" width="150" height="52" rx="6"/><text class="t" x="255" y="276" text-anchor="middle">GitHub Action</text><text class="s" x="255" y="293" text-anchor="middle">checks and thumbnails</text><rect class="box" x="180" y="326" width="150" height="52" rx="6"/><text class="t" x="255" y="350" text-anchor="middle">Jekyll builds</text><text class="s" x="255" y="367" text-anchor="middle">only if checks pass</text><path class="arrow" d="M255 230L255 252M257.397127693021,247.61208719054812L255 252L252.60287230697898,247.61208719054812"/><path class="arrow" d="M255 304L255 326M257.397127693021,321.61208719054815L255 326L252.60287230697898,321.61208719054815"/>
<path class="arrow" d="M85 378L135 420M133.18196737782725,415.3422368689772L135 420L130.09834025323286,419.01322154111335"/><path class="arrow" d="M255 378L205 420M209.90165974676714,419.01322154111335L205 420L206.81803262217275,415.3422368689772"/>
<rect class="pub" x="70" y="422" width="200" height="48" rx="6"/>
<text class="pt" x="170" y="443" text-anchor="middle">Published site</text>
<text class="ps" x="170" y="460" text-anchor="middle">GitHub Pages or any host</text>
<text class="s" x="170" y="498" text-anchor="middle">Same files, either route. Switch any time.</text>
</svg>